            "title": "Merge / Filter Retrieval",
            "type": "code",
            "code": "import json\nimport re\n\nASSET_ID_RE = re.compile(r\"asset_id:\\s*(PA-[A-Z]+-(?:\\d+-)?P\\d+)\")\nFIELD_RE = lambda name: re.compile(r\"- \" + re.escape(name) + r\":\\s*(.+)\")\nTITLE_RE = re.compile(r\"^#\\s+(.+)$\", re.MULTILINE)\n\nINTENT_PAGE_TYPES = {\n    \"strategy\": {\"strategy\", \"target_analysis\", \"channel_plan\"},\n    \"content\": {\"strategy\", \"content_plan\", \"channel_plan\"},\n    \"operation\": {\"operation_plan\", \"channel_plan\"},\n    \"risk\": {\"operation_plan\", \"risk\", \"process\"},\n    \"kpi\": {\"kpi\"},\n}\n\ndef field(content: str, name: str):\n    match = FIELD_RE(name).search(content)\n    return match.group(1).strip() if match else None\n\ndef number_or_text(value):\n    if value is None:\n        return None\n    try:\n        return int(value)\n    except Exception:\n        return value\n\ndef main(bundles: list) -> dict:\n    groups = {}\n\n    for raw_bundle in bundles:\n        bundle = json.loads(raw_bundle)\n        rid = str(bundle.get(\"requirement_id\") or \"\")\n        intent = str(bundle.get(\"intent\") or \"\").lower()\n        allowed = INTENT_PAGE_TYPES.get(intent)\n        group = groups.setdefault(rid, {\n            \"requirement_id\": rid,\n            \"intent\": intent,\n            \"queries\": [],\n            \"by_asset\": {},\n        })\n        group[\"queries\"].append(bundle.get(\"query\"))\n\n        for record in bundle.get(\"records\", []):\n            content = str(record.get(\"content\") or record.get(\"page_content\") or \"\")\n            metadata = record.get(\"metadata\") or {}\n            asset_id = metadata.get(\"asset_id\")\n            if not asset_id:\n                match = ASSET_ID_RE.search(content)\n                asset_id = match.group(1) if match else None\n            if not asset_id:\n                continue\n\n            page_type = metadata.get(\"page_type\") or field(content, \"page_type\")\n            if allowed and page_type not in allowed:\n                continue\n\n            title_match = TITLE_RE.search(content)\n            title = title_match.group(1).strip() if title_match else str(record.get(\"title\") or asset_id)\n            proposal_id = metadata.get(\"proposal_id\") or field(content, \"proposal_id\")\n            source_file = metadata.get(\"source_file\") or field(content, \"source_file\")\n            source_page = metadata.get(\"source_page\") or field(content, \"source_page\")\n            source_type = metadata.get(\"source_type\") or field(content, \"source_type\")\n            reuse_level = metadata.get(\"reuse_level\") or field(content, \"reuse_level\")\n            score = record.get(\"score\")\n            if score is None:\n                score = metadata.get(\"score\", 0)\n            try:\n                score = float(score or 0)\n            except Exception:\n                score = 0.0\n\n            candidate = {\n                \"asset_id\": asset_id,\n                \"title\": title,\n                \"text\": content,\n                \"metadata\": {\n                    \"asset_id\": asset_id,\n                    \"proposal_id\": proposal_id,\n                    \"page_type\": page_type,\n                    \"reuse_level\": reuse_level,\n                    \"source_file\": source_file,\n                    \"source_page\": number_or_text(source_page),\n                    \"source_type\": source_type,\n                },\n                \"retrieval_score\": score,\n            }\n\n            current = group[\"by_asset\"].get(asset_id)\n            if current is None or score > current.get(\"retrieval_score\", 0):\n                group[\"by_asset\"][asset_id] = candidate\n\n    results = []\n    for rid, group in groups.items():\n        candidates = list(group[\"by_asset\"].values())\n        candidates.sort(key=lambda item: (-float(item.get(\"retrieval_score\") or 0), item[\"asset_id\"]))\n        results.append({\n            \"requirement_id\": rid,\n            \"intent\": group[\"intent\"],\n            \"queries\": group[\"queries\"],\n            \"candidates\": candidates[:5],\n        })\n\n    results.sort(key=lambda item: item[\"requirement_id\"])\n    return {\"normalized\": json.dumps({\"results\": results}, ensure_ascii=False)}\n",
