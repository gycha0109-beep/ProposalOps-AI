        {
          "data": {
            "desc": "",
            "selected": false,
            "title": "Coverage Validator",
            "type": "code",
            "code": "import json\nimport re\n\ndef arr(value):\n    return value if isinstance(value, list) else []\n\ndef norm(value):\n    return re.sub(r\"\\s+\", \" \", str(value or \"\").strip().lower())\n\ndef main(rfp_json: str, strategy_json: str, evidence_json: str, pagination_json: str) -> dict:\n    rfp = json.loads(rfp_json)\n    strategy = json.loads(strategy_json)\n    evidence_payload = json.loads(evidence_json)\n    pagination = json.loads(pagination_json)\n\n    requirements = {\n        item.get(\"id\"): item\n        for item in arr(rfp.get(\"requirements\"))\n        if item.get(\"id\")\n    }\n    strategies = {\n        item.get(\"strategy_id\"): item\n        for item in arr(strategy.get(\"strategy_pillars\"))\n        if item.get(\"strategy_id\")\n    }\n\n    evidence_packs = evidence_payload.get(\"results\")\n    if not isinstance(evidence_packs, list):\n        evidence_packs = evidence_payload.get(\"evidence_packs\")\n    if not isinstance(evidence_packs, list):\n        evidence_packs = []\n\n    evidences = {}\n    for pack in evidence_packs:\n        rid = pack.get(\"requirement_id\")\n        for evidence in arr(pack.get(\"evidence\")):\n            eid = evidence.get(\"evidence_id\")\n            if eid:\n                evidences[eid] = {\n                    \"requirement_id\": rid,\n                    \"asset_id\": evidence.get(\"asset_id\"),\n                }\n\n    pages = arr(pagination.get(\"pages\"))\n    errors = []\n    warnings = []\n    covered = {rid: [] for rid in requirements}\n    seen_ids = set()\n    seen_numbers = set()\n    messages = {}\n\n    def block(code, page_id=None, requirement_id=None, reason=\"\"):\n        errors.append({\n            \"code\": code,\n            \"page_id\": page_id,\n            \"requirement_id\": requirement_id,\n            \"reason\": reason,\n        })\n\n    def warn(code, page_id=None, requirement_id=None, reason=\"\"):\n        warnings.append({\n            \"code\": code,\n            \"page_id\": page_id,\n            \"requirement_id\": requirement_id,\n            \"reason\": reason,\n        })\n\n    if not pages:\n        block(\"NO_PAGES\", reason=\"No pages generated.\")\n    if len(pages) > 8:\n        block(\"PAGE_LIMIT_EXCEEDED\", reason=\"More than 8 pages generated.\")\n\n    for index, page in enumerate(pages, start=1):\n        page_id = page.get(\"page_id\")\n        page_no = page.get(\"page_no\")\n\n        if not page_id:\n            block(\"MISSING_PAGE_ID\", reason=f\"Page {index} has no page_id.\")\n            page_id = f\"<position-{index}>\"\n        elif page_id in seen_ids:\n            block(\"DUPLICATE_PAGE_ID\", page_id=page_id, reason=\"Duplicate page_id.\")\n        seen_ids.add(page_id)\n\n        if page_no != index:\n            block(\"NON_SEQUENTIAL_PAGE_NO\", page_id=page_id, reason=f\"Expected {index}, got {page_no}.\")\n        if page_no in seen_numbers:\n            block(\"DUPLICATE_PAGE_NO\", page_id=page_id, reason=f\"Duplicate page_no {page_no}.\")\n        seen_numbers.add(page_no)\n\n        reqs = arr(page.get(\"rfp_requirement_ids\"))\n        strategy_ids = arr(page.get(\"strategy_ids\"))\n        evidence_ids = arr(page.get(\"evidence_ids\"))\n\n        for rid in reqs:\n            if rid not in requirements:\n                block(\"INVALID_REQUIREMENT_ID\", page_id=page_id, requirement_id=rid, reason=\"Unknown requirement.\")\n            else:\n                covered[rid].append(page_id)\n\n        for sid in strategy_ids:\n            pillar = strategies.get(sid)\n            if pillar is None:\n                block(\"INVALID_STRATEGY_ID\", page_id=page_id, reason=f\"Unknown strategy {sid}.\")\n                continue\n            pillar_reqs = set(arr(pillar.get(\"requirement_ids\")))\n            if reqs and not (pillar_reqs & set(reqs)):\n                block(\"STRATEGY_PAGE_MISMATCH\", page_id=page_id, reason=f\"{sid} does not support page requirements.\")\n            if pillar.get(\"classification\") in {\"REFERENCE_FACT\", \"REFERENCE_PATTERN\"} and reqs:\n                pillar_evidence = set(arr(pillar.get(\"evidence_ids\")))\n                if not (pillar_evidence & set(evidence_ids)):\n                    block(\"STRATEGY_EVIDENCE_MISSING\", page_id=page_id, reason=f\"{sid} has no attached supporting evidence.\")\n\n        for eid in evidence_ids:\n            evidence = evidences.get(eid)\n            if evidence is None:\n                block(\"INVALID_EVIDENCE_ID\", page_id=page_id, reason=f\"Unknown evidence {eid}.\")\n                continue\n            if reqs and evidence.get(\"requirement_id\") not in reqs:\n                block(\"EVIDENCE_PAGE_MISMATCH\", page_id=page_id, requirement_id=evidence.get(\"requirement_id\"), reason=f\"{eid} belongs to another requirement.\")\n\n        if not reqs and evidence_ids:\n            block(\"ORPHAN_EVIDENCE\", page_id=page_id, reason=\"Evidence exists without requirement linkage.\")\n\n        if str(page.get(\"fact_risk\") or \"\").lower() == \"high\" and not evidence_ids:\n            warn(\"HIGH_FACT_RISK_WITHOUT_EVIDENCE\", page_id=page_id, reason=\"High fact risk page has no evidence.\")\n\n        message = norm(page.get(\"key_message\"))\n        if message:\n            messages.setdefault(message, []).append(page_id)\n\n    for rid, page_ids in covered.items():\n        if not page_ids:\n            block(\"MISSING_REQUIREMENT\", requirement_id=rid, reason=\"Requirement is not covered by any page.\")\n\n    for page_ids in messages.values():\n        if len(page_ids) > 1:\n            warn(\"DUPLICATE_KEY_MESSAGE\", reason=f\"Duplicate key message on {page_ids}.\")\n\n    declared = {\n        row.get(\"requirement_id\"): row\n        for row in arr(pagination.get(\"requirement_coverage\"))\n        if isinstance(row, dict) and row.get(\"requirement_id\")\n    }\n    for rid in requirements:\n        row = declared.get(rid)\n        if row is None:\n            block(\"MISSING_COVERAGE_ROW\", requirement_id=rid, reason=\"Coverage row missing.\")\n            continue\n        expected_pages = sorted(covered[rid])\n        declared_pages = sorted(arr(row.get(\"page_ids\")))\n        if declared_pages != expected_pages:\n            block(\"COVERAGE_SUMMARY_MISMATCH\", requirement_id=rid, reason=\"Coverage page_ids do not match generated pages.\")\n        expected_status = \"COVERED\" if expected_pages else \"MISSING\"\n        if row.get(\"status\") != expected_status:\n            block(\"COVERAGE_STATUS_MISMATCH\", requirement_id=rid, reason=\"Coverage status does not match generated pages.\")\n\n    validation = {\n        \"status\": \"PASS\" if not errors else \"FAIL\",\n        \"blocking_errors\": errors,\n        \"warnings\": warnings,\n        \"coverage_summary\": {\n            \"total_requirements\": len(requirements),\n            \"covered\": sum(1 for ids in covered.values() if ids),\n            \"partial\": 0,\n            \"missing\": sum(1 for ids in covered.values() if not ids),\n        },\n        \"page_count\": len(pages),\n        \"page_limit\": 8,\n        \"requirement_page_map\": covered,\n    }\n    return {\n        \"status\": validation[\"status\"],\n        \"validation\": json.dumps(validation, ensure_ascii=False),\n    }\n",
