            "code": "import json\n\ndef main(planner_json: str) -> dict:\n    data = json.loads(planner_json)\n    plans = data.get(\"plans\", [])\n    items = []\n    for plan in plans:\n        requirement_id = str(plan.get(\"requirement_id\") or \"\").strip()\n        intent = str(plan.get(\"intent\") or \"\").strip()\n        queries = [str(q).strip() for q in plan.get(\"search_queries\", []) if str(q).strip()]\n        if not requirement_id:\n            raise ValueError(\"requirement_id is required\")\n        if len(queries) != 2 or len(set(queries)) != 2:\n            raise ValueError(f\"{requirement_id}: exactly two distinct search_queries are required\")\n        for query in queries:\n            items.append(json.dumps({\n                \"requirement_id\": requirement_id,\n                \"intent\": intent,\n                \"query\": query,\n            }, ensure_ascii=False))\n    return {\"items\": items}\n",
