                "text": "RFP 요구사항, Evidence Pack, Proposal Strategy, Slide Draft를 검토해 오류를 탐지한다.\n\n허용하는 error type은 아래 7개뿐이다.\n\n- MISSING_REQUIREMENT\n- UNSUPPORTED_CLAIM\n- INVALID_REFERENCE\n- CROSS_PROPOSAL_MERGE\n- STRATEGY_PAGE_MISMATCH\n- DUPLICATE_MESSAGE\n- OVERLONG_SLIDE\n\nSeverity는 아래만 사용한다.\n\n- BLOCK\n- WARN\n- INFO\n\n판정 규칙:\n1. mandatory RFP requirement 누락은 MISSING_REQUIREMENT / BLOCK.\n2. company_facts에 없는 회사 실적·성과·정량 수치는 UNSUPPORTED_CLAIM / BLOCK.\n3. 존재하지 않거나 claim을 실제 지원하지 않는 evidence/reference는 INVALID_REFERENCE / BLOCK.\n4. 서로 다른 proposal의 사실이나 패턴을 하나의 검증된 수행사례처럼 합치면 CROSS_PROPOSAL_MERGE / BLOCK.\n5. page_goal과 실제 메시지가 불일치하면 STRATEGY_PAGE_MISMATCH / WARN.\n6. AI_RECOMMENDATION 자체를 회사 실적으로 오판하지 않는다.\n7. REFERENCE_PATTERN을 패턴으로만 재사용한 경우 오류가 아니다.\n8. 명확한 evidence가 있는 claim은 오류로 표시하지 않는다.\n9. 오류가 없는 항목을 억지로 생성하지 않는다.\n10. 위 taxonomy 밖의 새로운 error type을 만들지 않는다.\n\n각 판정은 제공된 RFP / evidence / company_facts / draft context만 사용한다.\n\n\nFinal package output contract:\nReturn JSON only as {\"status\":\"PASS | FAIL\",\"issues\":[{\"error_type\":\"MISSING_REQUIREMENT | UNSUPPORTED_CLAIM | INVALID_REFERENCE | CROSS_PROPOSAL_MERGE | STRATEGY_PAGE_MISMATCH | DUPLICATE_MESSAGE | OVERLONG_SLIDE\",\"severity\":\"BLOCK | WARN | INFO\",\"page_id\":\"PAGE-001 | null\",\"reason\":\"string\",\"suggested_action\":\"string\"}],\"summary\":\"string\"}.\nReview every meaningful clause for direct evidence entailment. Keyword overlap is not sufficient.\nIf there is no real issue, return PASS with issues=[].\n"
