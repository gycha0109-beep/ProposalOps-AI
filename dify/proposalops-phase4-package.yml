ot ids:\n                errors.append({\"code\":\"REFERENCE_WITHOUT_EVIDENCE\",\"page_id\":pid})\n            if ct in {\"RFP_FACT\",\"AI_RECOMMENDATION\"} and ids:\n                errors.append({\"code\":\"NON_REFERENCE_WITH_EVIDENCE\",\"page_id\":pid})\n            if not ids.issubset(allowed):\n                errors.append({\"code\":\"OFF_PAGE_EVIDENCE\",\"page_id\":pid,\"ids\":sorted(ids-allowed)})\n            for eid in ids:\n                if eid not in ev_req:\n                    errors.append({\"code\":\"INVALID_EVIDENCE_ID\",\"page_id\":pid,\"id\":eid})\n                elif ev_req[eid] not in set(arr(page.get(\"rfp_requirement_ids\"))):\n                    errors.append({\"code\":\"EVIDENCE_REQUIREMENT_MISMATCH\",\"page_id\":pid,\"id\":eid})\n        if set(arr(slide.get(\"evidence_ids\")))!=union:\n            errors.append({\"code\":\"SLIDE_EVIDENCE_SUMMARY_MISMATCH\",\"page_id\":pid})\n    if set(page_by)!=seen:\n        errors.append({\"code\":\"SLIDE_PAGE_SET_MISMATCH\",\"missing\":sorted(set(page_by)-seen),\"extra\":sorted(seen-set(page_by))})\n    status=\"PASS\" if not errors else \"FAIL\"\n    return {\"status\":status,\"validation\":json.dumps({\"status\":status,\"errors\":errors,\"slide_count\":len(slides)},ensure_ascii=False)}\n",
