                "text": "# Production Draft — Targeted Repair\n\nStatus: **DEMO VALIDATED — NOT FROZEN**\n\n\n## Validation status\n\nRFP-TEST-002 live E2E에서 실제 사용되었습니다. Final provenance-chain repair 이후 package QA는 PASS / issues 0이었습니다.\n\n이 prompt는 전용 frozen benchmark/holdout을 별도로 수행하지 않았으므로 benchmark-frozen production prompt로 표현하지 않습니다.\n\n입력:\n1. QA error 1개 또는 동일 원인의 error 묶음\n2. 오류가 발생한 stage의 현재 output\n3. 관련 RFP / Evidence / Strategy context\n\n목표는 실패한 부분만 수정하고 이미 통과한 결과는 보존하는 것입니다.\n\n## Routing\n\n- strategy requirement/evidence 오류 → Proposal Strategist\n- page coverage/structure 오류 → Pagination Planner\n- slide factual claim/body 오류 → 해당 Slide Draft만\n- visual factual/data 오류 → 해당 Visual Prompt만\n\n## Rules\n\n1. QA가 지적하지 않은 다른 page/stage를 다시 생성하지 않습니다.\n2. 기존 ID를 가능한 한 유지합니다.\n3. BLOCK 원인을 제거했는지 repair_summary에 명시합니다.\n4. 새로운 factual claim을 추가할 때는 evidence가 필요합니다.\n5. 근거가 없으면 삭제하거나 AI_RECOMMENDATION / client confirmation으로 전환합니다.\n6. 수정 범위를 넓혀야만 해결 가능한 경우 escalation_required=true로 반환합니다.\n\n## Output\n\nJSON만 출력합니다.\n\n{\n  \"target_stage\": \"strategy | pagination | slide | visual\",\n  \"target_ids\": [\"PAGE-001\"],\n  \"repaired_output\": {},\n  \"repair_summary\": [\n    {\n      \"error_code\": \"string\",\n      \"change\": \"string\",\n      \"resolved\": true\n    }\n  ],\n  \"escalation_required\": false,\n  \"escalation_reason\": null\n}\n\n\nStudio repair contract:\nReturn JSON only:\n{\n  \"strategy_repairs\":[{\"strategy_id\":\"ST-01\",\"repaired_pillar\":{}}],\n  \"page_repairs\":[{\"page_id\":\"PAGE-001\",\"repaired_page\":null,\"repaired_slide\":{},\"repaired_visual\":{}}],\n  \"repair_summary\":[{\"error_type\":\"INVALID_REFERENCE\",\"target_id\":\"PAGE-001\",\"change\":\"string\",\"resolved\":true}],\n  \"escalation_required\":false,\n  \"escalation_reason\":null\n}\nRepair only IDs listed in REPAIR ROUTE.\nDo not modify unaffected IDs.\nEvidence scope is authoritative; narrow unsupported wording or move it to AI_RECOMMENDATION with no 