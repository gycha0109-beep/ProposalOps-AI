            "code": "import json,re\nNUM=re.compile(r\"\\d+(?:[.,]\\d+)?(?:%|명|건|편|원|초|개월|회)\")\ndef arr(v): return v if isinstance(v,list) else []\ndef nums(v): return set(NUM.findall(str(v or \"\")))\ndef main(visuals_json:str,slides_json:str,pagination_json:str)->dict:\n    try:\n        vp=json.loads(visuals_json); sp=json.loads(slides_json); pg=json.loads(pagination_json)\n    except Exception as e:\n        return {\"status\":\"FAIL\",\"validation\":json.dumps({\"error\":\"json_parse\",\"detail\":str(e)},ensure_ascii=False)}\n    visuals=arr(vp.get(\"visuals\")); slides=arr(sp.get(\"slides\")); pages=arr(pg.get(\"pages\"))\n    slide_by={x.get(\"page_id\"):x for x in slides if x.get(\"page_id\")}\n    page_by={x.get(\"page_id\"):x for x in pages if x.get(\"page_id\")}\n    errors=[]; seen=set()\n    for visual in visuals:\n        pid=visual.get(\"page_id\")\n        if not pid or pid in seen or pid not in slide_by or pid not in page_by:\n            errors.append({\"code\":\"INVALID_VISUAL_PAGE\",\"page_id\":pid}); continue\n        seen.add(pid); slide=slide_by[pid]; page=page_by[pid]\n        if visual.get(\"visual_type\")!=slide.get(\"visual_type\"):\n            errors.append({\"code\":\"VISUAL_TYPE_MISMATCH\",\"page_id\":pid})\n        if not set(arr(visual.get(\"data_source\"))).issubset(set(arr(slide.get(\"evidence_ids\")))):\n            errors.append({\"code\":\"VISUAL_OFF_SLIDE_EVIDENCE\",\"page_id\":pid})\n        if visual.get(\"visual_type\")==\"reference_image\":\n            errors.append({\"code\":\"REFERENCE_IMAGE_UNAVAILABLE\",\"page_id\":pid})\n        diagram=visual.get(\"diagram_spec\") or {}; nodes=arr(diagram.get(\"nodes\")); edge_rows=arr(diagram.get(\"edges\"))\n        if visual.get(\"visual_type\")==\"process_diagram\" and (len(nodes)<2 or not edge_rows):\n            errors.append({\"code\":\"INVALID_PROCESS_DIAGRAM\",\"page_id\":pid})\n        slide_blob=\" \".join([str(slide.get(\"headline\") or \"\"),str(slide.get(\"subheadline\") or \"\"),\" \".join(str(b.get(\"text\") or \"\") for b in arr(slide.get(\"body_blocks\")))])\n        page_blob=\" \".join([str(page.get(\"title\") or \"\"),str(page.get(\"page_goal\") or \"\"),str(page.get(\"key_message\") or \"\"),\" \".join(str(b.get(\"intent\") or \"\") for b in arr(page.get(\"content_blocks\")) if isinstance(b,dict))])\n        if visual.get(\"visual_type\")==\"data_chart\" and not nums(slide_blob):\n            errors.append({\"code\":\"DATA_CHART_WITHOUT_NUMERIC_INPUT\",\"page_id\":pid})\n        visible=[str(visual.get(\"purpose\") or \"\"),str(visual.get(\"image_prompt\") or \"\")]\n        for n in nodes:\n            if isinstance(n,dict):\n                for k in (\"label\",\"detail\",\"description\",\"metric\",\"text\"):\n                    if n.get(k) is not None: visible.append(str(n.get(k)))\n        for erow in edge_rows:\n            if isinstance(erow,dict) and erow.get(\"label\") is not None: visible.append(str(erow.get(\"label\")))\n        invented=sorted(nums(\" \".join(visible))-nums(slide_blob+\" \"+page_blob))\n        if invented: errors.append({\"code\":\"VISUAL_INVENTED_NUMBER\",\"page_id\":pid,\"values\":invented})\n    if set(slide_by)!=seen:\n        errors.append({\"code\":\"VISUAL_PAGE_SET_MISMATCH\",\"missing\":sorted(set(slide_by)-seen),\"extra\":sorted(seen-set(slide_by))})\n    status=\"PASS\" if not errors else \"FAIL\"\n    return {\"status\":status,\"validation\":json.dumps({\"status\":status,\"errors\":errors,\"visual_count\":len(visuals)},ensure_ascii=False)}\n",
