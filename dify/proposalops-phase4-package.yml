"STRATEGY_ID_CONFLICT\",\"id\":sid,\"nested_id\":nested_sid})\n            continue\n        obj[\"strategy_id\"]=sid\n        strategy[\"strategy_pillars\"][sidx[sid]]=obj\n    for item in arr(repair.get(\"page_repairs\")):\n        pid=item.get(\"page_id\")\n        if pid not in allowed_p: errors.append({\"code\":\"UNEXPECTED_PAGE_REPAIR\",\"id\":pid}); continue\n        for key,index,container in ((\"repaired_page\",pidx,pagination.get(\"pages\")),(\"repaired_slide\",slidx,slides.get(\"slides\")),(\"repaired_visual\",vidx,visuals.get(\"visuals\"))):\n            obj=item.get(key)\n            if obj is None: continue\n            if pid not in index or not isinstance(obj,dict):\n                errors.append({\"code\":\"INVALID_\"+key.upper(),\"id\":pid})\n                continue\n            nested_pid=obj.get(\"page_id\")\n            if nested_pid not in (None,\"\",pid):\n                errors.append({\"code\":\"PAGE_ID_CONFLICT\",\"field\":key,\"id\":pid,\"nested_id\":nested_pid})\n                continue\n            obj[\"page_id\"]=pid\n            container[index[pid]]=obj\n    page_ids={x.get(\"page_id\") for x in arr(pagination.get(\"pages\"))}\n    slide_ids={x.get(\"page_id\") for x in arr(slides.get(\"slides\"))}\n    visual_ids={x.get(\"page_id\") for x in arr(visuals.get(\"visuals\"))}\n    if page_ids!=slide_ids or page_ids!=visual_ids: errors.append({\"code\":\"PAGE_SET_MISMATCH\"})\n    status=\"PASS\" if not errors else \"FAIL\"\n    return {\"status\":status,\"strategy\":json.dumps(strategy,ensure_ascii=False),\"pagination\":json.dumps(pagination,ensure_ascii=False),\"slides\":json.dumps(slides,ensure_ascii=False),\"visuals\":json.dumps(visuals,ensure_ascii=False),\"validation\":json.dumps({\"status\":status,\"errors\":errors},ensure_ascii=False)}\n",
