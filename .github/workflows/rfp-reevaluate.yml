name: Re-evaluate RFP Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".benchmark/rfp-reeval-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reevaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Re-evaluate stored raw runs
        run: |
          python scripts/re_evaluate_rfp_runs.py \
            --root runs/rfp_analyzer/benchmark-v1-gemini36 \
            --remove-stale-failures

      - name: Rebuild report
        run: |
          python scripts/aggregate_rfp_runs.py \
            --root runs/rfp_analyzer/benchmark-v1-gemini36/dev \
            --json-out reports/rfp-analyzer-dev-v1-gemini36.json \
            --md-out reports/rfp-analyzer-dev-v1-gemini36.md

      - name: Commit re-evaluated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/rfp_analyzer/benchmark-v1-gemini36 reports/rfp-analyzer-dev-v1-gemini36.*
          if git diff --cached --quiet; then
            echo "No re-evaluation changes."
            exit 0
          fi
          git commit -m "benchmark: re-evaluate Gemini 3.6 RFP runs"
          git push
