name: Dify Phase 2 Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".benchmark/dify-phase2-core-trigger"

permissions:
  contents: write

concurrency:
  group: dify-phase2-core
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Require live credentials
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [[ -z "$DIFY_API_KEY" ]]; then
            echo "DIFY_API_KEY is not configured."
            exit 1
          fi

      - name: Validate Phase 2 plan
        run: python scripts/run_dify_phase2_core.py --plan-only

      - name: Run Phase 2 grounded strategy core
        shell: bash
        run: |
          set +e
          python scripts/run_dify_phase2_core.py
          EXIT_CODE=$?
          echo "phase2_exit_code=$EXIT_CODE" >> "$GITHUB_ENV"
          exit 0

      - name: Commit Phase 2 evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runs/dify/phase2 reports/dify-phase2-core-* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Phase 2 evidence changes to commit."
          else
            git commit -m "dify: record phase2 grounded strategy evidence"
            git pull --rebase origin main
            git push
          fi

      - name: Enforce Phase 2 gate
        shell: bash
        run: |
          if [[ "${phase2_exit_code:-0}" != "0" ]]; then
            exit "$phase2_exit_code"
          fi
