name: Benchmark Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compile benchmark scripts
        run: python -m compileall -q scripts

      - name: Verify frozen benchmark inventory
        run: python scripts/benchmark_inventory.py --assert-v1

      - name: Validate production chain contracts
        run: python scripts/validate_production_chain.py

      - name: Validate prompt variants
        run: python scripts/generate_prompt_diff.py --check

      - name: Validate RFP dev execution matrix
        run: |
          python scripts/run_rfp_benchmark.py \
            --split dev \
            --versions all \
            --repetitions 1 \
            --plan-only > /tmp/rfp-dev-plan.json
          cat /tmp/rfp-dev-plan.json

      - name: Validate protected holdout matrix
        run: |
          python scripts/run_rfp_benchmark.py \
            --split holdout \
            --versions all \
            --repetitions 1 \
            --plan-only > /tmp/rfp-holdout-plan.json
          cat /tmp/rfp-holdout-plan.json

      - name: Validate RFP candidate state
        run: |
          python scripts/validate_candidate_state.py \
            --state evals/frozen/v1/rfp-analyzer-candidate.json

      - name: Self-test Proposal QA evaluator and neutral inputs
        run: python scripts/selftest_qa_eval.py

      - name: Validate Proposal QA dev batch plan
        run: |
          python scripts/run_qa_benchmark.py \
            --split dev \
            --versions all \
            --plan-only > /tmp/qa-dev-plan.json
          cat /tmp/qa-dev-plan.json

      - name: Validate Proposal QA holdout batch plan
        run: |
          python scripts/run_qa_benchmark.py \
            --split holdout \
            --versions all \
            --plan-only > /tmp/qa-holdout-plan.json
          cat /tmp/qa-holdout-plan.json

      - name: Validate Proposal QA candidate state
        run: |
          python scripts/validate_candidate_state.py \
            --state evals/frozen/v1/proposal-qa-candidate.json

      - name: Self-test Proposal Strategist neutral inputs
        run: python scripts/selftest_strategy_inputs.py

      - name: Validate Proposal Strategist dev batch plan
        run: |
          python scripts/run_strategy_benchmark.py \
            --split dev \
            --versions all \
            --plan-only > /tmp/strategist-dev-plan.json
          cat /tmp/strategist-dev-plan.json

      - name: Validate Proposal Strategist holdout batch plan
        run: |
          python scripts/run_strategy_benchmark.py \
            --split holdout \
            --versions all \
            --plan-only > /tmp/strategist-holdout-plan.json
          cat /tmp/strategist-holdout-plan.json

      - name: Validate Proposal Strategist candidate state
        run: |
          python scripts/validate_candidate_state.py \
            --state evals/frozen/v1/proposal-strategist-candidate.json

      - name: Validate Evidence Builder dev batch plan
        run: |
          python scripts/run_evidence_builder_benchmark.py \
            --versions all \
            --plan-only > /tmp/evidence-builder-dev-plan.json
          cat /tmp/evidence-builder-dev-plan.json

      - name: Validate committed Dify production export
        run: |
          python scripts/validate_dify_export.py \
            --root exports/dify/knowledge-v1 \
            --expected-count 51

      - name: Validate committed Dify benchmark export
        run: |
          python scripts/validate_dify_export.py \
            --root exports/dify/benchmark-v1 \
            --expected-count 63 \
            --allow-distractors

      - name: Regenerate Dify exports in scratch space
        run: |
          python scripts/export_dify_knowledge.py \
            --out /tmp/dify-production
          python scripts/validate_dify_export.py \
            --root /tmp/dify-production \
            --expected-count 51
          python scripts/export_dify_knowledge.py \
            --out /tmp/dify-benchmark \
            --include-distractors
          python scripts/validate_dify_export.py \
            --root /tmp/dify-benchmark \
            --expected-count 63 \
            --allow-distractors

      - name: Validate Dify live operation plans
        run: |
          python scripts/upload_dify_knowledge.py \
            --manifest exports/dify/knowledge-v1/documents.jsonl \
            --plan-only
          python scripts/upload_dify_knowledge.py \
            --manifest exports/dify/benchmark-v1/documents.jsonl \
            --plan-only
          python scripts/ensure_dify_datasets.py --plan-only
          python scripts/evaluate_dify_retrieval.py --plan-only

      - name: Validate Dify Phase 2 core plan
        run: python scripts/run_dify_phase2_core.py --plan-only

      - name: Validate Dify Phase 3 pagination plan
        run: python scripts/run_dify_phase3_pagination.py --plan-only

      - name: Validate Dify Phase 2 DSL candidate
        run: python scripts/validate_dify_phase2_dsl.py

      - name: Validate Dify Phase 3 DSL candidate
        run: python scripts/validate_dify_phase3_dsl.py

      - name: Run retrieval baseline on dev split
        run: |
          python scripts/evaluate_retrieval.py \
            --gold evals/frozen/v1/dev/retrieval.json \
            --out retrieval-dev.json
          cat retrieval-dev.json

      - name: Run retrieval baseline on holdout split
        run: |
          python scripts/evaluate_retrieval.py \
            --gold evals/frozen/v1/holdout/retrieval.json \
            --out retrieval-holdout.json
          cat retrieval-holdout.json
