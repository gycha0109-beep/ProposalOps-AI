name: Dify Phase 3 Pagination

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".benchmark/dify-phase3-pagination-trigger"

permissions:
  contents: write

concurrency:
  group: dify-phase3-pagination
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Require OpenAI API key
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Validate Phase 3 plan
        run: python scripts/run_dify_phase3_pagination.py --plan-only

      - name: Run Pagination and Coverage Gate
        shell: bash
        run: |
          set +e
          python scripts/run_dify_phase3_pagination.py
          EXIT_CODE=$?
          echo "phase3_exit_code=$EXIT_CODE" >> "$GITHUB_ENV"
          exit 0

      - name: Commit Phase 3 evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runs/dify/phase3 reports/dify-phase3-pagination-* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Phase 3 evidence changes to commit."
          else
            git commit -m "dify: record phase3 pagination evidence"
            git pull --rebase origin main
            git push
          fi

      - name: Enforce Phase 3 gate
        shell: bash
        run: |
          if [[ "${phase3_exit_code:-0}" != "0" ]]; then
            exit "$phase3_exit_code"
          fi
