name: Dify Knowledge Phase 1

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - upload-production
          - upload-benchmark
          - retrieve-benchmark
          - semantic-benchmark
          - full-phase1
  push:
    branches: [main]
    paths:
      - ".benchmark/dify-knowledge-trigger"
      - ".github/workflows/dify-knowledge-phase1.yml"

permissions:
  contents: write

concurrency:
  group: dify-knowledge-phase1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_DATASET_ID: ${{ secrets.DIFY_DATASET_ID }}
      DIFY_BENCHMARK_DATASET_ID: ${{ secrets.DIFY_BENCHMARK_DATASET_ID }}
      DIFY_API_BASE: ${{ secrets.DIFY_API_BASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve operation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            OP="${{ inputs.operation }}"
          elif [[ -f .benchmark/dify-knowledge-trigger ]]; then
            OP="$(awk -F': *' '/^operation:/ {print $2; exit}' .benchmark/dify-knowledge-trigger)"
          else
            OP="plan"
          fi
          if [[ -z "$OP" ]]; then OP="plan"; fi
          echo "DIFY_OPERATION=$OP" >> "$GITHUB_ENV"
          echo "operation=$OP"

      - name: Validate exports
        run: |
          python scripts/validate_dify_export.py \
            --root exports/dify/knowledge-v1 \
            --expected-count 51
          python scripts/validate_dify_export.py \
            --root exports/dify/benchmark-v1 \
            --expected-count 63 \
            --allow-distractors

      - name: Plan only
        if: env.DIFY_OPERATION == 'plan'
        run: |
          python scripts/upload_dify_knowledge.py \
            --manifest exports/dify/knowledge-v1/documents.jsonl \
            --sandbox-compact \
            --compact-document-name "ProposalOps Production v1 - sandbox-economy-v1" \
            --plan-only
          python scripts/upload_dify_knowledge.py \
            --manifest exports/dify/benchmark-v1/documents.jsonl \
            --sandbox-compact \
            --compact-document-name "ProposalOps Benchmark v1 - sandbox-economy-v1" \
            --plan-only
          python scripts/ensure_dify_datasets.py --plan-only
          python scripts/evaluate_dify_retrieval.py --plan-only

      - name: Require Dify API key
        if: env.DIFY_OPERATION != 'plan'
        shell: bash
        run: |
          if [[ -z "$DIFY_API_KEY" ]]; then
            echo "Repository secret DIFY_API_KEY is not configured."
            exit 1
          fi

      - name: Ensure Dify datasets
        if: env.DIFY_OPERATION != 'plan' && env.DIFY_OPERATION != 'semantic-benchmark'
        shell: bash
        run: |
          python scripts/ensure_dify_datasets.py \
            --delay-seconds 7 \
            --indexing-technique economy \
            --out runs/dify/datasets.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          with open("runs/dify/datasets.json", encoding="utf-8") as handle:
              data = json.load(handle)
          print("DIFY_PRODUCTION_ID=" + data["production"]["dataset_id"])
          print("DIFY_BENCHMARK_ID=" + data["benchmark"]["dataset_id"])
          PY
          sleep 7

      - name: Upload production knowledge
        if: env.DIFY_OPERATION == 'upload-production' || env.DIFY_OPERATION == 'full-phase1'
        shell: bash
        run: |
          DATASET_ID="${DIFY_DATASET_ID:-$DIFY_PRODUCTION_ID}"
          python scripts/upload_dify_knowledge.py \
            --manifest exports/dify/knowledge-v1/documents.jsonl \
            --dataset-id "$DATASET_ID" \
            --delay-seconds 7 \
            --indexing-technique economy \
            --sandbox-compact \
            --compact-document-name "ProposalOps Production v1 - sandbox-economy-v1" \
            --state-out runs/dify/knowledge-v1/upload-state.json
          sleep 7

      - name: Upload benchmark knowledge
        if: env.DIFY_OPERATION == 'upload-benchmark' || env.DIFY_OPERATION == 'full-phase1'
        shell: bash
        run: |
          DATASET_ID="${DIFY_BENCHMARK_DATASET_ID:-$DIFY_BENCHMARK_ID}"
          python scripts/upload_dify_knowledge.py \
            --manifest exports/dify/benchmark-v1/documents.jsonl \
            --dataset-id "$DATASET_ID" \
            --delay-seconds 7 \
            --indexing-technique economy \
            --sandbox-compact \
            --compact-document-name "ProposalOps Benchmark v1 - sandbox-economy-v1" \
            --state-out runs/dify/benchmark-v1/upload-state.json
          sleep 7

      - name: Run Dify retrieval benchmark
        if: env.DIFY_OPERATION == 'retrieve-benchmark' || env.DIFY_OPERATION == 'full-phase1'
        shell: bash
        run: |
          DATASET_ID="${DIFY_BENCHMARK_DATASET_ID:-$DIFY_BENCHMARK_ID}"
          python scripts/evaluate_dify_retrieval.py \
            --dataset-id "$DATASET_ID" \
            --delay-seconds 7 \
            --search-method keyword_search \
            --out reports/dify-retrieval-v1-economy.json

      - name: Run Dify semantic benchmark
        if: env.DIFY_OPERATION == 'semantic-benchmark'
        shell: bash
        run: |
          DATASET_ID="e72cbe16-1eef-4858-9e35-61d5e00326bf"
          python scripts/evaluate_dify_retrieval.py \
            --dataset-id "$DATASET_ID" \
            --delay-seconds 7 \
            --search-method semantic_search \
            --out reports/dify-retrieval-v1-semantic.json

      - name: Commit live evidence
        if: env.DIFY_OPERATION != 'plan'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/dify reports/dify-retrieval-v1*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Dify evidence changes to commit."
            exit 0
          fi
          git commit -m "dify: record $DIFY_OPERATION evidence"
          git pull --rebase origin main
          git push
